services:
  - type: web
    name: growtopia-clone
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: growtopia-db
          property: connectionString

databases:
  - name: growtopia-db
    plan: free
